{% extends 'auth/navbar.html' %}
{% load static %}

{% block content %}
<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
    {% if messages %}
        {% for message in messages %}
            <div class="toast align-items-center text-white 
                {% if message.tags == 'error' %}bg-danger
                {% elif message.tags == 'success' %}bg-success
                {% elif message.tags == 'info' %}bg-info
                {% elif message.tags == 'warning' %}bg-warning
                {% else %}bg-primary{% endif %} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        {% endfor %}
    {% endif %}
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="card shadow">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0">Verify OTP</h4>
                </div>
                <div class="card-body">
                    <p>Enter the OTP sent to your new email address.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="otp" class="form-label">OTP</label>
                            <input type="text" class="form-control" id="otp" name="otp" required>
                        </div>
                        <button type="submit" class="btn btn-success">Verify OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var toastElList = [].slice.call(document.querySelectorAll('.toast'));
    var toastList = toastElList.map(function (toastEl) {
        return new bootstrap.Toast(toastEl, {
            autohide: true,
            delay: 5000 // Toast auto-hides after 5 seconds
        });
    });
    toastList.forEach(function (toast) {
        toast.show();
    });
});
</script>
{% endblock %}
