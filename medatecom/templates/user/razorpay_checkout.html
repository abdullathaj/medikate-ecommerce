{% extends 'auth/navbar.html' %}
{% block content %}
<div class="container text-center mt-5" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <h3>Processing Payment...</h3>
    <div class="spinner-border text-primary mt-3 mb-3" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p>Please wait while we redirect you to the payment gateway.</p>
    <button id="rzp-button1" class="btn btn-primary mt-3">Pay Now</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_merchant_key }}", 
    "amount": "{{ razorpay_amount }}", 
    "currency": "{{ currency }}",
    "name": "MedAT eCommerce",
    "description": "Payment for your order",
    "order_id": "{{ razorpay_order_id }}", 
    "callback_url": "{{ callback_url }}",
    "prefill": {
        "name": "{{ request.user.first_name }} {{ request.user.last_name }}",
        "email": "{{ request.user.email }}",
        "contact": "{{ request.user.phone }}"
    },
    "theme": {
        "color": "#3399cc"
    },
    "modal": {
        "ondismiss": function(){
             window.location.replace("{% url 'order_error' %}");
        }
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
// Auto open
window.onload = function(){
    document.getElementById('rzp-button1').click();
};
</script>
{% endblock %}
