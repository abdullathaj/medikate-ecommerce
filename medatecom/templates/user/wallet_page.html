{% extends 'auth/navbar.html' %}
{% load static %}

{% block content %}
 <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        {% if messages %}
            {% for message in messages %}
                <div class="toast align-items-center text-white 
                    {% if message.tags == 'error' %}bg-danger
                    {% elif message.tags == 'success' %}bg-success
                    {% elif message.tags == 'info' %}bg-info
                    {% elif message.tags == 'warning' %}bg-warning
                    {% else %}bg-primary{% endif %} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            {{ message }}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            {% endfor %}
        {% endif %}
    </div>

<div class="container mt-5 d-flex justify-content-center">
    <div class="card shadow-lg border-0 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="card-body text-center p-4">
            <h2 class="mb-4 text-primary fw-bold">Wallet</h2>
            
            <div class="bg-light p-4 rounded-3">
                <h5 class="mb-2">Current Balance</h5>
                <p class="display-6 fw-bold text-success">₹{{ wallet.balance }}</p>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript to Initialize Toasts -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    var toastElList = [].slice.call(document.querySelectorAll('.toast'));
    var toastList = toastElList.map(function (toastEl) {
        return new bootstrap.Toast(toastEl, {
            autohide: true,
            delay: 5000 // Toast auto-hides after 5 seconds
        });
    });
    toastList.forEach(function (toast) {
        toast.show();
    });
});
</script>
{% endblock %}
